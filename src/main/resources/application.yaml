spring:
  application:
    name: toswap

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:1}

  session:
    store-type: redis
    redis:
      namespace: toswap:session

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

external:
  gemini:
    api-key: ${GEMINI_API_KEY}
  unsplash:
    api-key: ${UNSPLASH_API_KEY}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html       # Swagger UI 접속 경로
    tags-sorter: alpha            # 태그 알파벳 정렬
    operations-sorter: alpha      # 엔드포인트 알파벳 정렬
    display-request-duration: true  # 응답 시간 표시 (Gemini 호출 시간 확인용)
  api-docs:
    path: /v3/api-docs
